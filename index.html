<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>情绪酒馆 - Emotion Bar</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0c0c0e; color:#fff; font-family:'Lato',sans-serif; overflow:hidden; }
  .screen { display:none; height:100%; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px; }
  .active { display:flex; }
  button { padding:14px 28px; font-size:16px; border-radius:999px; border:none; background:white; color:black; cursor:pointer; }
  .glass { width:220px; height:320px; border-radius:0 0 40px 40px; border:2px solid rgba(255,255,255,0.2); position:relative; overflow:hidden; margin-bottom:16px; }
  .liquid { position:absolute; bottom:0; width:100%; transition:height 0.3s ease; }
  .wave { position:absolute; top:-20px; width:200%; height:40px; background:rgba(255,255,255,0.2); filter:blur(2px); animation:wave 3s linear infinite; }
  @keyframes wave { from{transform:translateX(0);} to{transform:translateX(-50%);} }
  .hint { opacity:0.4; letter-spacing:0.3em; font-size:12px; margin-bottom:10px; }
  #recipe { list-style:none; padding:0; opacity:.8; font-size:14px; margin-top:12px; }
  #drinkName { font-family:'Cormorant Garamond', serif; font-size:2em; margin:0; }
  #note { margin-top:8px; font-style:italic; opacity:.6; }
</style>
</head>
<body>

<!-- ① INTRO -->
<div id="intro" class="screen active">
  <h1>今天的情绪，适合一杯什么？</h1>
  <button onclick="startMix()">开始调制</button>
</div>

<!-- ② MIX -->
<div id="mixing" class="screen">
  <div class="glass">
    <div id="liquid" class="liquid" style="height:0%; background:linear-gradient(to top,#ff7a18,#ffb347);">
      <div class="wave"></div>
    </div>
  </div>
  <div class="hint">摇动手机，调制情绪</div>
  <div id="percent" style="font-size:10px;opacity:.3">0%</div>
</div>

<!-- ③ RESULT -->
<div id="result" class="screen">
  <h2 id="drinkName"></h2>
  <p id="abv"></p>
  <ul id="recipe"></ul>
  <p id="note"></p>
  <button onclick="restart()">再来一杯</button>
</div>

<script>
let view = 'intro';
let shakeEnergy = 0;
const stats = { totalEnergy:0, maxStrength:0, shakeCount:0 };
const mood = 'ANGRY'; // 展示版本可以随意修改
const moodProfile = { ANGRY:{ideal:35,abvBase:18}, CALM:{ideal:18,abvBase:6}, SAD:{ideal:22,abvBase:10}, HAPPY:{ideal:28,abvBase:12} };

const ingredientDB = {
  ANGRY: { base:['威士忌','龙舌兰','黑朗姆'], note:['辣椒','苦精','烟熏盐'], garnish:['炭烧橙皮','辣椒片'] },
  CALM: { base:['琴酒','清酒','白朗姆'], note:['薰衣草','蜂蜜','洋甘菊'], garnish:['柠檬皮','白花'] },
  SAD: { base:['白兰地','波本','红酒'], note:['可可','黑糖','咖啡'], garnish:['肉桂棒'] },
  HAPPY: { base:['伏特加','气泡酒','白葡萄酒'], note:['柑橘','莓果','薄荷'], garnish:['水果片','薄荷叶'] }
};

const shakeAudio = new Audio('shake.mp3');
const liquidAudio = new Audio('liquid.mp3');
shakeAudio.loop=true; liquidAudio.loop=true; shakeAudio.volume=0; liquidAudio.volume=0;

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

async function startMix(){
  if(typeof DeviceMotionEvent?.requestPermission==='function'){
    const res = await DeviceMotionEvent.requestPermission();
    if(res!=='granted') return alert('需要动作权限');
  }
  shakeEnergy=0; stats.totalEnergy=0; stats.shakeCount=0; stats.maxStrength=0;
  document.getElementById('liquid').style.height='0%';
  document.getElementById('percent').innerText='0%';
  show('mixing'); view='mixing';
}

window.addEventListener('devicemotion', e=>{
  if(view!=='mixing') return;
  const a=e.accelerationIncludingGravity;
  if(!a) return;
  const strength=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
  if(strength<15) return;
  stats.totalEnergy+=strength;
  stats.maxStrength=Math.max(stats.maxStrength,strength);
  stats.shakeCount++;
  shakeEnergy=Math.min(shakeEnergy+strength*0.4,100);
  document.getElementById('liquid').style.height=shakeEnergy+'%';
  document.getElementById('percent').innerText=Math.floor(shakeEnergy)+'%';
  const norm=Math.min(strength/40,1);
  shakeAudio.volume=norm*0.8; liquidAudio.volume=norm*0.5;
  if(shakeAudio.paused) shakeAudio.play();
  if(liquidAudio.paused) liquidAudio.play();
  if(shakeEnergy>=100) finishMix();
});

function finishMix(){
  view='result';
  shakeAudio.pause(); liquidAudio.pause();
  const profile=moodProfile[mood];
  const strengthScore=Math.min(stats.maxStrength/profile.ideal,1.5);
  const controlScore=Math.min(stats.shakeCount/40,1);
  const abv=(profile.abvBase+strengthScore*6+controlScore*4).toFixed(1);

  // 生成配方
  const pool=ingredientDB[mood];
  const base=abv>18?pool.base[0]:pool.base[Math.floor(Math.random()*pool.base.length)];
  const note=stats.shakeCount>30?pool.note[Math.floor(Math.random()*pool.note.length)]:pool.note[0];
  const garnish=pool.garnish[Math.floor(Math.random()*pool.garnish.length)];

  document.getElementById('drinkName').innerText='情绪特调';
  document.getElementById('abv').innerText='酒精度 '+abv+'%';
  document.getElementById('recipe').innerHTML=`<li>基酒：${base}</li><li>风味：${note}</li><li>点缀：${garnish}</li>`;
  document.getElementById('note').innerText=abv>20?'这一杯，摇得太用力了。':abv<8?'更像一杯温柔的情绪饮料。':'力度刚好，情绪被完美溶解。';

  show('result');
}

function restart(){ show('intro'); view='intro'; }
</script>

</body>
</html>
