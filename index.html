<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>情绪酒馆 - Mood Mixology</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  body { background-color: #0c0c0e; color: #EAEAEA; font-family: 'Lato', sans-serif; margin:0; overflow:hidden; }
  .ios-circle-fix { position: relative; overflow: hidden; border-radius: 9999px; width: 15rem; height: 15rem; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ---- 简化图标 ----
const ChevronLeft = () => <svg width="24" height="24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg>;

// ---- 情绪数据库 ----
const EMOTION_DATABASE = {
  joy:{label:'喜悦与明亮',colors:['from-[#FF9A9E] to-[#FECFEF]'],blobColors:['bg-[#FF9A9E]','bg-[#F6D365]','bg-[#FECFEF]'],bases:['桃红香槟','百香果利口酒'],notes:{top:'甜橙',middle:'茉莉',baseNote:'香草'},names:['夏日多巴胺'],quote:'愿你口袋里装着此刻的糖，去抵御未来的寒。'},
  calm:{label:'平静与本心',colors:['from-[#D7DDE8] to-[#757F9A]'],blobColors:['bg-[#BBD2C5]','bg-[#93A5CF]','bg-[#757F9A]'],bases:['白葡萄酒','白朗姆'],notes:{top:'青草',middle:'绿茶',baseNote:'檀香'},names:['禅意花园'],quote:'心若止水，万物皆安。这就足够了。'}
};

// ---- 主程序 ----
const App = () => {
  const [view,setView] = useState('ANALYSIS');
  const [inputText,setInputText] = useState('');
  const [moodCategory,setMoodCategory] = useState('calm');
  const [currentDrink,setCurrentDrink] = useState(null);
  const [history,setHistory] = useState([]);
  const [shakeValue,setShakeValue] = useState(0);
  const shakeRef = useRef(0);
  const drinkReadyRef = useRef(false);

  // ---- 文本分析 ----
  const handleInputChange=(e)=>{
    const text=e.target.value;
    setInputText(text);
    const keywords = {
      joy:/开心|快乐|喜|笑/i,
      calm:/平静|淡定|安宁/i
    };
    if(keywords.joy.test(text)) setMoodCategory('joy');
    else setMoodCategory('calm');
  };

  // ---- 生成饮品 ----
  const generateDrink=(manual=true)=>{
    if(!inputText.trim() && manual) return;
    setView('MIXING');
    drinkReadyRef.current = false;
    const data=EMOTION_DATABASE[moodCategory];
    const drink={
      id:Date.now(),
      mood:moodCategory,
      name:data.names[0],
      colorClass:data.colors[0],
      blobColors:data.blobColors,
      ingredients:{base:data.bases[Math.floor(Math.random()*data.bases.length)],...data.notes},
      quote:data.quote,
      abv:(5+Math.random()*20).toFixed(1)
    };
    setCurrentDrink(drink);
    // 如果是手动点击，延时显示
    if(manual){
      setTimeout(()=>{
        setHistory(prev=>[drink,...prev]);
        setView('RESULT');
      },3500);
    }
  };

  // ---- 摇动监听 ----
  useEffect(()=>{
    if(!('DeviceMotionEvent' in window)) return;
    const handler = async (e)=>{
      if(view!=='ANALYSIS') return;
      if(typeof DeviceMotionEvent?.requestPermission==='function'){
        const res = await DeviceMotionEvent.requestPermission();
        if(res!=='granted') return;
      }
      const a=e.accelerationIncludingGravity;
      if(!a) return;
      const strength=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
      if(strength<15) return;
      shakeRef.current+=strength;
      setShakeValue(Math.min(shakeRef.current,100));
      if(shakeRef.current>70 && !drinkReadyRef.current){
        drinkReadyRef.current = true;
        generateDrink(false);
      }
    };
    window.addEventListener('devicemotion',handler);
    return ()=>window.removeEventListener('devicemotion',handler);
  },[view]);

  return (
    <div className="h-full w-full flex flex-col relative px-6 py-10">
      {view==='ANALYSIS' && (
        <div className="flex flex-col items-center justify-center h-full">
          <div className="ios-circle-fix mb-10 flex items-end justify-center">
            <div className="absolute bottom-0 w-full h-[40%] bg-gradient-to-t from-blue-400 to-blue-200" style={{height:shakeValue+'%'}}></div>
          </div>
          <textarea
            className="w-full max-w-sm p-4 text-center text-2xl font-artistic text-white bg-transparent placeholder-white/10 focus:outline-none mb-6"
            placeholder="告诉我，你现在感觉如何？"
            value={inputText} onChange={handleInputChange} rows={2}/>
          <button onClick={()=>generateDrink(true)}>开始调制</button>
          {shakeValue>0 && <p className="mt-4 text-white/40">摇动进度: {Math.floor(shakeValue)}%</p>}
        </div>
      )}

      {view==='MIXING' && currentDrink && (
        <div className="flex flex-col items-center justify-center h-full">
          <div className="ios-circle-fix mb-8 flex items-end justify-center">
            <div className="absolute bottom-0 w-full bg-gradient-to-t" style={{height:'65%',background:'linear-gradient(to top,#ff9a9e,#fecfeF)'}}></div>
          </div>
          <p>正在提取情绪精华...</p>
        </div>
      )}

      {view==='RESULT' && currentDrink && (
        <div className="flex flex-col items-center h-full">
          <h1 id="drinkName" className="text-3xl font-artistic mb-2">{currentDrink.name}</h1>
          <p className="text-white/30 mb-4">酒精度: {currentDrink.abv}%</p>
          <ul id="recipe" className="mb-4">
            <li>基酒: {currentDrink.ingredients.base}</li>
            <li>前调: {currentDrink.ingredients.top}</li>
            <li>中调: {currentDrink.ingredients.middle}</li>
            <li>尾调: {currentDrink.ingredients.baseNote}</li>
          </ul>
          <p id="note" className="italic text-white/40 text-center mb-4">“{currentDrink.quote}”</p>
          <button onClick={()=>{ setInputText(''); shakeRef.current=0; setShakeValue(0); setView('ANALYSIS'); }}>再来一杯</button>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
